# ============================================================
# codemagic.yaml - NutriCoach AI
# Build iOS sin cola de macOS (runners dedicados Codemagic)
# Plan free: 500 min/mes
# Docs: https://docs.codemagic.io/yaml-basic-configuration/
# ============================================================

workflows:
  ios-debug:
    name: iOS Debug
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
      groups:
        - Supabase
      ios_signing:
        distribution_type: development
        bundle_identifier: com.joelmortees.nutricoach
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
        - pattern: 'feat/*'
          include: true
        - pattern: 'test/*'
          include: true
    scripts:
      - name: Set up Ruby + CocoaPods
        script: |
          gem install --no-document cocoapods
      - name: Install xcodegen
        script: brew install xcodegen
      - name: Generate Xcode project
        script: |
          cd ios
          xcodegen generate
      - name: Resolve SPM dependencies
        script: |
          xcodebuild -resolvePackageDependencies \
            -project ios/NutriCoach.xcodeproj \
            -scheme NutriCoach
      - name: Set up code signing profiles
        script: |
          # Codemagic descarga el certificado y los perfiles de la app y sus
          # extensiones declarados en ios_signing.
          xcode-project use-profiles --project ios/NutriCoach.xcodeproj
      - name: Build (Debug, signed)
        script: |
          mkdir -p build
          set -o pipefail
          xcodebuild \
            -project ios/NutriCoach.xcodeproj \
            -scheme NutriCoach \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            ENABLE_PREVIEWS=NO \
            SWIFT_ENABLE_PREVIEWS=NO \
            ENABLE_DEBUG_DYLIB=NO \
            GENERATE_INFOPLIST_FILE=NO \
            SUPABASE_URL="$SUPABASE_URL" \
            SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            build > build/xcodebuild.log 2>&1
          EXIT=$?
          echo "=== BUILD EXIT CODE: $EXIT ==="
          echo ""
          echo "=== Entitlements del binario firmado ==="
          APP_PATH_AFTER_BUILD=$(find build/DerivedData -name "NutriCoach.app" -type d | head -1)
          if [ -n "$APP_PATH_AFTER_BUILD" ]; then
            codesign --display --entitlements - --xml "$APP_PATH_AFTER_BUILD" 2>/dev/null
            echo ""
            echo "=== Firma del binario ==="
            codesign -dvv "$APP_PATH_AFTER_BUILD" 2>&1 | head -15
            if ! codesign --verify --deep --strict "$APP_PATH_AFTER_BUILD"; then
              EXIT=1
            fi
            WIDGET_PATH="$APP_PATH_AFTER_BUILD/PlugIns/NutriCoachWidgets.appex"
            if [ -d "$WIDGET_PATH" ]; then
              echo ""
              echo "=== Firma de la extension WidgetKit ==="
              codesign -dvv "$WIDGET_PATH" 2>&1 | head -15
              codesign --display --entitlements - --xml "$WIDGET_PATH" 2>/dev/null
              if ! codesign --verify --strict "$WIDGET_PATH"; then
                EXIT=1
              fi
            else
              echo "ERROR: la extension WidgetKit no esta embebida en el .app"
              EXIT=1
            fi
          else
            echo "(no se encontro .app)"
            EXIT=1
          fi
          echo ""
          echo "=== Todos los errores (sin filtro) ==="
          grep -E "error:" build/xcodebuild.log | head -40 || echo "(sin errores)"
          echo ""
          echo "=== Errores por archivo (resumen) ==="
          grep -E "error:" build/xcodebuild.log | grep -oE "[A-Za-z]+\.swift:[0-9]+:[0-9]+:" | sort -u
          echo ""
          echo "=== Ultimas 30 lineas del log ==="
          tail -30 build/xcodebuild.log
          exit $EXIT
      - name: Debug build output
        script: |
          echo "=== Products dir ==="
          ls -la build/DerivedData/Build/Products/Debug-iphoneos/ 2>&1 || echo "NO EXISTE"
          echo ""
          echo "=== App bundle ==="
          ls -la build/DerivedData/Build/Products/Debug-iphoneos/NutriCoach.app/ 2>&1 || echo "NO EXISTE"
          echo ""
          echo "=== Binary info ==="
          file build/DerivedData/Build/Products/Debug-iphoneos/NutriCoach.app/NutriCoach 2>&1 || echo "NO EXISTE"
          echo ""
          echo "=== App size ==="
          du -sh build/DerivedData/Build/Products/Debug-iphoneos/NutriCoach.app 2>&1 || echo "NO EXISTE"
      - name: Verify signatures
        script: |
          set -e
          APP_PATH=$(find build/DerivedData -name "NutriCoach.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: no se encontro NutriCoach.app"
            exit 1
          fi
          WIDGET_PATH="$APP_PATH/PlugIns/NutriCoachWidgets.appex"
          codesign --verify --deep --strict "$APP_PATH"
          codesign --verify --strict "$WIDGET_PATH"
          codesign --display --entitlements - --xml "$APP_PATH" > build/app-entitlements.plist 2>/dev/null
          codesign --display --entitlements - --xml "$WIDGET_PATH" > build/widget-entitlements.plist 2>/dev/null

          APP_GROUP=$(/usr/libexec/PlistBuddy -c "Print :com.apple.security.application-groups:0" build/app-entitlements.plist)
          WIDGET_GROUP=$(/usr/libexec/PlistBuddy -c "Print :com.apple.security.application-groups:0" build/widget-entitlements.plist)
          APPLE_SIGN_IN=$(/usr/libexec/PlistBuddy -c "Print :com.apple.developer.applesignin:0" build/app-entitlements.plist)

          test "$APP_GROUP" = "group.com.joelmortees.nutricoach" || { echo "ERROR: falta App Groups en la app"; exit 1; }
          test "$WIDGET_GROUP" = "group.com.joelmortees.nutricoach" || { echo "ERROR: falta App Groups en el widget"; exit 1; }
          test "$APPLE_SIGN_IN" = "Default" || { echo "ERROR: falta Sign in with Apple en la app"; exit 1; }
          grep -q "com.joelmortees.nutricoach.shared" build/app-entitlements.plist || { echo "ERROR: falta Keychain Sharing en la app"; exit 1; }
          grep -q "com.joelmortees.nutricoach.shared" build/widget-entitlements.plist || { echo "ERROR: falta Keychain Sharing en el widget"; exit 1; }

          echo "=== Entitlements validados de la app ==="
          cat build/app-entitlements.plist
          echo "=== Entitlements validados del widget ==="
          cat build/widget-entitlements.plist
      - name: Create IPA
        script: |
          set -euo pipefail
          APP_PATH=$(find build/DerivedData -name "NutriCoach.app" -type d | head -1)
          echo "App path: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: no se encontro NutriCoach.app"
            exit 1
          fi
          if [ ! -f "$APP_PATH/NutriCoach" ]; then
            echo "ERROR: el binario NutriCoach no existe en el .app"
            ls -la "$APP_PATH"
            exit 1
          fi
          WIDGET_PATH="$APP_PATH/PlugIns/NutriCoachWidgets.appex"
          if [ ! -d "$WIDGET_PATH" ]; then
            echo "ERROR: no existe $WIDGET_PATH"
            find "$APP_PATH" -maxdepth 3 -print
            exit 1
          fi
          echo "=== App bundle final ==="
          ls -la "$APP_PATH"
          echo ""
          echo "=== App size ==="
          du -sh "$APP_PATH"
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build && zip -qr NutriCoach-Debug.ipa Payload && cd ..
          echo ""
          echo "=== IPA final ==="
          ls -lh build/NutriCoach-Debug.ipa
    artifacts:
      - build/NutriCoach-Debug.ipa
      - build/xcodebuild.log
      - build/app-entitlements.plist
      - build/widget-entitlements.plist
    publishing:
      email:
        recipients:
          - joelmortees@gmail.com
        notify:
          success: true
          failure: true

  ios-signed:
    name: iOS Signed (for FlekStore)
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
      groups:
        - Supabase
      ios_signing:
        distribution_type: development
        bundle_identifier: com.joelmortees.nutricoach
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
    scripts:
      - name: Set up Ruby + CocoaPods
        script: |
          gem install --no-document cocoapods
      - name: Install xcodegen
        script: brew install xcodegen
      - name: Generate Xcode project
        script: |
          cd ios
          xcodegen generate
      - name: Resolve SPM dependencies
        script: |
          xcodebuild -resolvePackageDependencies \
            -project ios/NutriCoach.xcodeproj \
            -scheme NutriCoach
      - name: Set up code signing profiles
        script: |
          xcode-project use-profiles --project ios/NutriCoach.xcodeproj
      - name: Build (Release, signed)
        script: |
          mkdir -p build
          set -o pipefail
          xcodebuild \
            -project ios/NutriCoach.xcodeproj \
            -scheme NutriCoach \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -allowProvisioningUpdates \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Development" \
            SUPABASE_URL="$SUPABASE_URL" \
            SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            build | tee build/xcodebuild-signed.log
      - name: Verify signed entitlements
        script: |
          set -e
          APP_PATH=$(find build/DerivedData -name "NutriCoach.app" -type d | head -1)
          WIDGET_PATH="$APP_PATH/PlugIns/NutriCoachWidgets.appex"
          codesign --verify --deep --strict "$APP_PATH"
          codesign --verify --strict "$WIDGET_PATH"
          codesign --display --entitlements - --xml "$APP_PATH" > build/app-entitlements.plist 2>/dev/null
          codesign --display --entitlements - --xml "$WIDGET_PATH" > build/widget-entitlements.plist 2>/dev/null

          APP_GROUP=$(/usr/libexec/PlistBuddy -c "Print :com.apple.security.application-groups:0" build/app-entitlements.plist)
          WIDGET_GROUP=$(/usr/libexec/PlistBuddy -c "Print :com.apple.security.application-groups:0" build/widget-entitlements.plist)
          APPLE_SIGN_IN=$(/usr/libexec/PlistBuddy -c "Print :com.apple.developer.applesignin:0" build/app-entitlements.plist)

          test "$APP_GROUP" = "group.com.joelmortees.nutricoach" || { echo "ERROR: falta App Groups en la app"; exit 1; }
          test "$WIDGET_GROUP" = "group.com.joelmortees.nutricoach" || { echo "ERROR: falta App Groups en el widget"; exit 1; }
          test "$APPLE_SIGN_IN" = "Default" || { echo "ERROR: falta Sign in with Apple en la app"; exit 1; }
          grep -q "com.joelmortees.nutricoach.shared" build/app-entitlements.plist || { echo "ERROR: falta Keychain Sharing en la app"; exit 1; }
          grep -q "com.joelmortees.nutricoach.shared" build/widget-entitlements.plist || { echo "ERROR: falta Keychain Sharing en el widget"; exit 1; }
      - name: Create IPA
        script: |
          set -euo pipefail
          APP_PATH=$(find build/DerivedData -name "NutriCoach.app" -type d | head -1)
          echo "App path: $APP_PATH"
          if [ -z "$APP_PATH" ] || [ ! -f "$APP_PATH/NutriCoach" ]; then
            echo "ERROR: no se encontro una aplicacion compilada valida"
            exit 1
          fi
          WIDGET_PATH="$APP_PATH/PlugIns/NutriCoachWidgets.appex"
          if [ ! -d "$WIDGET_PATH" ]; then
            echo "ERROR: no existe $WIDGET_PATH"
            find "$APP_PATH" -maxdepth 3 -print
            exit 1
          fi
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build && zip -qr NutriCoach-Release.ipa Payload && cd ..
          ls -lh build/NutriCoach-Release.ipa
    artifacts:
      - build/NutriCoach-Release.ipa
      - build/xcodebuild-signed.log
      - build/app-entitlements.plist
      - build/widget-entitlements.plist
    publishing:
      email:
        recipients:
          - joelmortees@gmail.com
        notify:
          success: true
          failure: true
