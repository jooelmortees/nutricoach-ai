# ============================================================
# Deploy Edge Functions a Supabase
# Se ejecuta manualmente o al hacer push a main
# ============================================================

name: Deploy Edge Functions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Supabase CLI
        run: npm install -g supabase

      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          # Login no interactivo con access token (CI-friendly)
          supabase login --token "$SUPABASE_ACCESS_TOKEN"
          supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy chat-proxy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase functions deploy chat-proxy \
            --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy hk-sync
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy hk-sync --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy mcp-router
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy mcp-router --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy recalculate-macros
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy recalculate-macros --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy generate-plan
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy generate-plan --project-ref "$SUPABASE_PROJECT_REF"

      - name: Set Edge Function secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          USDA_FDC_API_KEY: ${{ secrets.USDA_FDC_API_KEY }}
        run: |
          echo "Configurando secrets de Edge Functions..."
          supabase secrets set \
            GEMINI_API_KEY="$GEMINI_API_KEY" \
            GEMINI_MODEL="$GEMINI_MODEL" \
            USDA_FDC_API_KEY="$USDA_FDC_API_KEY" \
            --project-ref "$SUPABASE_PROJECT_REF"

      - name: Summary
        run: |
          echo "✅ Edge Functions desplegadas"
          echo "Endpoints:"
          echo "  https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/chat-proxy"
          echo "  https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/hk-sync"
          echo "  https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/mcp-router"
