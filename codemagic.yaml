# ============================================================
# codemagic.yaml - NutriCoach AI
# Build iOS sin cola de macOS (runners dedicados Codemagic)
# Plan free: 500 min/mes
# Docs: https://docs.codemagic.io/yaml-basic-configuration/
# ============================================================

workflows:
  ios-debug:
    name: iOS Debug
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
      groups:
        - Supabase
        - Certificado
      # iOS signing: Codemagic inyecta CM_CERTIFICATE, CM_CERTIFICATE_PASSWORD
      # y CM_PROVISIONING_PROFILE desde el cert/profile "NutriCoach" subidos a
      # Personal Account > Code signing identities. El bundle_id debe coincidir
      # con el del .mobileprovision (com.joelmortees.nutricoach).
      ios_signing:
        distribution_type: development
        bundle_identifier: com.joelmortees.nutricoach
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: 'main'
          include: true
        - pattern: 'feat/*'
          include: true
        - pattern: 'test/*'
          include: true
    scripts:
      - name: Set up Ruby + CocoaPods
        script: |
          gem install --no-document cocoapods
      - name: Install xcodegen
        script: brew install xcodegen
      - name: Generate Xcode project
        script: |
          cd ios
          xcodegen generate
      - name: Resolve SPM dependencies
        script: |
          xcodebuild -resolvePackageDependencies \
            -project ios/NutriCoach.xcodeproj \
            -scheme NutriCoach
      - name: Set up code signing (keychain + cert + profile)
        script: |
          # Crea keychain temporal
          keychain initialize
          # Decodifica cert (base64) y lo anade al keychain
          echo "=== Anadiendo cert al keychain ==="
          echo $CM_CERTIFICATE | base64 --decode > /tmp/cert.p12
          keychain add-certificates \
            --certificate /tmp/cert.p12 \
            --certificate-password $CERT_PASSWORD
          # Decodifica profile y lo guarda en el path que xcodebuild espera
          echo ""
          echo "=== Guardando provisioning profile ==="
          PROFILES_HOME="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_HOME"
          PROFILE_PATH="$(mktemp "$PROFILES_HOME"/$(uuidgen).mobileprovision)"
          echo $CM_PROVISIONING_PROFILE | base64 --decode > "$PROFILE_PATH"
          echo "Profile: $PROFILE_PATH"
          # Verificacion rapida del profile
          security cms -D -i "$PROFILE_PATH" 2>&1 | head -5
      - name: Build (Debug, signed)
        script: |
          mkdir -p build
          set -o pipefail
          # xcodebuild firma automaticamente usando:
          # - El cert del keychain (anadido en el step anterior)
          # - El provisioning profile decodificado
          # - Los entitlements del .entitlements
          xcodebuild \
            -project ios/NutriCoach.xcodeproj \
            -scheme NutriCoach \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGN_ENTITLEMENTS=ios/Sources/Resources/NutriCoach.entitlements \
            ENABLE_PREVIEWS=NO \
            SWIFT_ENABLE_PREVIEWS=NO \
            ENABLE_DEBUG_DYLIB=NO \
            GENERATE_INFOPLIST_FILE=NO \
            build > build/xcodebuild.log 2>&1
          EXIT=$?
          echo "=== BUILD EXIT CODE: $EXIT ==="
          echo ""
          echo "=== Entitlements del binario firmado ==="
          APP_PATH_AFTER_BUILD=$(find build/DerivedData -name "NutriCoach.app" -type d | head -1)
          if [ -n "$APP_PATH_AFTER_BUILD" ]; then
            codesign -d --entitlements :- "$APP_PATH_AFTER_BUILD" 2>&1
            echo ""
            echo "=== Firma del binario ==="
            codesign -dvv "$APP_PATH_AFTER_BUILD" 2>&1 | head -15
          else
            echo "(no se encontro .app)"
          fi
          echo ""
          echo "=== Todos los errores (sin filtro) ==="
          grep -E "error:" build/xcodebuild.log | head -40 || echo "(sin errores)"
          echo ""
          echo "=== Errores por archivo (resumen) ==="
          grep -E "error:" build/xcodebuild.log | grep -oE "[A-Za-z]+\.swift:[0-9]+:[0-9]+:" | sort -u
          echo ""
          echo "=== Ultimas 30 lineas del log ==="
          tail -30 build/xcodebuild.log
          exit $EXIT
      - name: Debug build output
        script: |
          echo "=== Products dir ==="
          ls -la build/DerivedData/Build/Products/Debug-iphoneos/ 2>&1 || echo "NO EXISTE"
          echo ""
          echo "=== App bundle ==="
          ls -la build/DerivedData/Build/Products/Debug-iphoneos/NutriCoach.app/ 2>&1 || echo "NO EXISTE"
          echo ""
          echo "=== Binary info ==="
          file build/DerivedData/Build/Products/Debug-iphoneos/NutriCoach.app/NutriCoach 2>&1 || echo "NO EXISTE"
          echo ""
          echo "=== App size ==="
          du -sh build/DerivedData/Build/Products/Debug-iphoneos/NutriCoach.app 2>&1 || echo "NO EXISTE"
      - name: Inject env vars into Info.plist
        script: |
          APP_PATH=$(find build/DerivedData -name "NutriCoach.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: no se encontro NutriCoach.app para inyectar env vars"
            exit 1
          fi
          PLIST="$APP_PATH/Info.plist"
          if [ ! -f "$PLIST" ]; then
            echo "ERROR: no existe $PLIST"
            exit 1
          fi
          echo "=== Info.plist ANTES de inyectar (primeras 30 lineas) ==="
          /usr/libexec/PlistBuddy -c "Print" "$PLIST" 2>&1 | head -30
          echo ""
          echo "=== Keys SUPABASE_ existentes antes? ==="
          /usr/libexec/PlistBuddy -c "Print" "$PLIST" 2>&1 | grep -E "SUPABASE_" || echo "(ninguna)"
          echo ""
          echo "=== Inyectando env vars en $PLIST ==="
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "ERROR: SUPABASE_URL y/o SUPABASE_ANON_KEY no estan definidas en Codemagic env vars"
            echo "Configuralas en: Codemagic UI > Settings > Environment variables"
            exit 1
          fi
          # 'Add' crea la key si no existe, 'Set' la actualiza si existe.
          # Usamos ambos para cubrir ambos casos (el .app/Info.plist puede
          # tener o no las keys, dependiendo de si xcodebuild regenera el file).
          /usr/libexec/PlistBuddy -c "Add :SUPABASE_URL string $SUPABASE_URL" "$PLIST" 2>&1 || \
            /usr/libexec/PlistBuddy -c "Set :SUPABASE_URL $SUPABASE_URL" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :SUPABASE_ANON_KEY string $SUPABASE_ANON_KEY" "$PLIST" 2>&1 || \
            /usr/libexec/PlistBuddy -c "Set :SUPABASE_ANON_KEY $SUPABASE_ANON_KEY" "$PLIST"
          echo ""
          echo "=== Info.plist DESPUES de inyectar (solo SUPABASE_) ==="
          /usr/libexec/PlistBuddy -c "Print :SUPABASE_URL" "$PLIST" 2>&1 | head -3
          /usr/libexec/PlistBuddy -c "Print :SUPABASE_ANON_KEY" "$PLIST" 2>&1 | head -3
      - name: Re-sign with entitlements (ad-hoc, backup)
        script: |
          # Con signing real ya no hace falta re-firmar. El binario sale
          # firmado por xcodebuild con el cert y profile de Codemagic.
          APP_PATH=$(find build/DerivedData -name "NutriCoach.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: no se encontro NutriCoach.app"
            exit 1
          fi
          echo "=== Verificacion final del binario firmado ==="
          codesign -dvv "$APP_PATH" 2>&1 | head -15
          echo ""
          echo "=== Entitlements finales ==="
          codesign -d --entitlements :- "$APP_PATH" 2>&1 | head -30
      - name: Create IPA (no signing)
        script: |
          APP_PATH=$(find build/DerivedData -name "NutriCoach.app" -type d | head -1)
          echo "App path: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: no se encontro NutriCoach.app"
            exit 1
          fi
          if [ ! -f "$APP_PATH/NutriCoach" ]; then
            echo "ERROR: el binario NutriCoach no existe en el .app"
            ls -la "$APP_PATH"
            exit 1
          fi
          # En Xcode 26 con SPM, los frameworks se linkean estaticamente al
          # binario (PackageFrameworks queda vacio). Es el comportamiento
          # normal y esperado, asi que solo copiamos si hay algo.
          PKG_FW_DIR=$(dirname "$APP_PATH")/PackageFrameworks
          if [ -d "$PKG_FW_DIR" ] && [ -n "$(ls -A "$PKG_FW_DIR" 2>/dev/null)" ]; then
            echo "=== PackageFrameworks contents ==="
            ls -la "$PKG_FW_DIR"
            mkdir -p "$APP_PATH/Frameworks"
            cp -R "$PKG_FW_DIR"/* "$APP_PATH/Frameworks/"
            echo "=== Frameworks copiados al .app ==="
            ls -la "$APP_PATH/Frameworks"
          else
            echo "INFO: PackageFrameworks vacio (Xcode 26 linkea SPM estaticamente)"
          fi
          echo "=== App bundle final ==="
          ls -la "$APP_PATH"
          echo ""
          echo "=== App size ==="
          du -sh "$APP_PATH"
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build && zip -qr NutriCoach-Debug-unsigned.ipa Payload && cd ..
          echo ""
          echo "=== IPA final ==="
          ls -lh build/NutriCoach-Debug-unsigned.ipa
    artifacts:
      - build/NutriCoach-Debug-unsigned.ipa
      - build/xcodebuild.log
    publishing:
      email:
        recipients:
          - joelmortees@gmail.com
        notify:
          success: true
          failure: true

  ios-signed:
    name: iOS Signed (for sideloadly)
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
      groups:
        - app_store_connect   # grupo con Apple creds (configurar en UI)
        - bundle_identifiers  # grupo con bundle id
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
    scripts:
      - name: Set up Ruby + CocoaPods
        script: |
          gem install --no-document cocoapods
      - name: Install xcodegen
        script: brew install xcodegen
      - name: Generate Xcode project
        script: |
          cd ios
          xcodegen generate
      - name: Resolve SPM dependencies
        script: |
          xcodebuild -resolvePackageDependencies \
            -project ios/NutriCoach.xcodeproj \
            -scheme NutriCoach
      - name: Build (Release, signed)
        script: |
          mkdir -p build
          xcodebuild \
            -project ios/NutriCoach.xcodeproj \
            -scheme NutriCoach \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Development" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$APPLE_BUNDLE_ID" \
            build | tee build/xcodebuild-signed.log
      - name: Create IPA
        script: |
          APP_PATH=$(find build/DerivedData -name "NutriCoach.app" -type d | head -1)
          echo "App path: $APP_PATH"
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          zip -qr build/NutriCoach-Release.ipa build/Payload
          ls -lh build/NutriCoach-Release.ipa
    artifacts:
      - build/NutriCoach-Release.ipa
      - build/xcodebuild-signed.log
    publishing:
      email:
        recipients:
          - joelmortees@gmail.com
        notify:
          success: true
          failure: true
