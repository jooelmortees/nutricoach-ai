# ============================================================
# Build iOS sin Mac
# Compila el proyecto Xcode en un runner macOS-arm64 de GitHub Actions
# y genera un IPA sin firma para que Sideloadly o AltStore lo firme
# ============================================================

name: Build iOS

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Build configuration"
        required: true
        default: "Debug"
        type: choice
        options: [Debug, Release]
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/build-ios.yml"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package iOS
    runs-on: macos-15
    timeout-minutes: 30

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Show SDKs
        run: xcodebuild -showsdks

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
            ios/.build
            ios/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('ios/Package.resolved', 'ios/project.yml') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          cd ios
          xcodegen generate

      - name: Validate Supabase configuration
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "ERROR: faltan SUPABASE_URL o SUPABASE_ANON_KEY en GitHub Secrets"
            exit 1
          fi
          curl -fsS "$SUPABASE_URL/auth/v1/settings" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            | ruby -rjson -e 'settings = JSON.parse(STDIN.read); abort("ERROR: Google OAuth no esta activado en Supabase") unless settings.dig("external", "google") == true'

      - name: Resolve SPM dependencies
        run: |
          cd ios
          xcodebuild -resolvePackageDependencies \
            -project NutriCoach.xcodeproj \
            -scheme NutriCoach

      - name: Build (no signing)
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild \
            -project ios/NutriCoach.xcodeproj \
            -scheme NutriCoach \
            -configuration ${{ inputs.configuration || 'Debug' }} \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SUPABASE_URL="$SUPABASE_URL" \
            SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            build | tee build/xcodebuild.log | tail -100

      - name: Verify widget embedding
        run: |
          CONFIGURATION="${{ inputs.configuration || 'Debug' }}"
          APP_PATH="build/DerivedData/Build/Products/${CONFIGURATION}-iphoneos/NutriCoach.app"
          WIDGET_PATH="$APP_PATH/PlugIns/NutriCoachWidgets.appex"
          if [ -z "$APP_PATH" ] || [ ! -d "$WIDGET_PATH" ]; then
            echo "ERROR: NutriCoachWidgets.appex no esta embebida en NutriCoach.app"
            find build/DerivedData/Build/Products -maxdepth 5 -print
            exit 1
          fi
          echo "Widget embebido: $WIDGET_PATH"

      - name: Create unsigned IPA
        run: |
          CONFIGURATION="${{ inputs.configuration || 'Debug' }}"
          APP_PATH="build/DerivedData/Build/Products/${CONFIGURATION}-iphoneos/NutriCoach.app"
          echo "App path: $APP_PATH"
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -qr "NutriCoach-${CONFIGURATION}-unsigned.ipa" Payload
          ls -lh NutriCoach-*.ipa

      - name: Upload artifact (IPA + logs)
        uses: actions/upload-artifact@v4
        with:
          name: nutricoach-ipa-${{ inputs.configuration || 'Debug' }}
          path: |
            build/NutriCoach-*.ipa
            build/xcodebuild.log
          retention-days: 30
          if-no-files-found: error
