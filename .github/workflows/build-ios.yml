# ============================================================
# Build iOS sin Mac
# Compila el proyecto Xcode en un runner macOS-arm64 de GitHub Actions
# y genera un IPA listo para sideloadly
# ============================================================

name: Build iOS

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Build configuration"
        required: true
        default: "Debug"
        type: choice
        options: [Debug, Release]
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/build-ios.yml"
  pull_request:
    branches: [main]
    paths:
      - "ios/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package iOS
    runs-on: macos-15-arm64
    timeout-minutes: 30

    env:
      BUNDLE_ID: ${{ vars.APPLE_BUNDLE_ID || 'com.nutricoach.app' }}
      DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
      KEYCHAIN_PASSWORD: ${{ github.run_id }}-kc-pwd

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version
        # Esperado: Xcode 16.x con iOS 18 SDK

      - name: Show SDKs
        run: xcodebuild -showsdks

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
            ios/.build
            ios/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('ios/Package.resolved', 'ios/project.yml') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          cd ios
          xcodegen generate

      - name: Verify Bundle ID
        run: |
          echo "Bundle ID: $BUNDLE_ID"
          echo "Team ID: $DEVELOPMENT_TEAM"

      - name: Resolve SPM dependencies
        run: |
          cd ios
          xcodebuild -resolvePackageDependencies \
            -project NutriCoach.xcodeproj \
            -scheme NutriCoach

      # ------------------------------------------------------------
      # 1) Build (sin firmar) para validar que todo compila
      # ------------------------------------------------------------
      - name: Build (no signing)
        run: |
          xcodebuild \
            -project ios/NutriCoach.xcodeproj \
            -scheme NutriCoach \
            -configuration ${{ inputs.configuration || 'Debug' }} \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build/xcodebuild.log | tail -100

      # ------------------------------------------------------------
      # 2) Build con firma para generar IPA instalable
      # ------------------------------------------------------------
      - name: Import Apple Developer certificate
        if: env.DEVELOPMENT_TEAM != ''
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
        run: |
          set -euo pipefail

          # Crear keychain temporal
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          # Decodificar API key
          API_KEY_PATH=$RUNNER_TEMP/AuthKey_${APPLE_KEY_ID}.p8
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$API_KEY_PATH"

          # Listar signing identities disponibles (profiling)
          security find-identity -v -p codesigning

      - name: Build (signed for sideloadly)
        if: env.DEVELOPMENT_TEAM != ''
        run: |
          xcodebuild \
            -project ios/NutriCoach.xcodeproj \
            -scheme NutriCoach \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Development" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            build | tee build/xcodebuild-signed.log | tail -50

      - name: Create IPA
        if: env.DEVELOPMENT_TEAM != ''
        run: |
          APP_PATH=$(find build/DerivedData -name "NutriCoach.app" -type d | head -1)
          echo "App path: $APP_PATH"

          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/

          cd build
          zip -qr NutriCoach-${{ inputs.configuration || 'Debug' }}.ipa Payload
          ls -lh NutriCoach-*.ipa

      - name: Upload artifact (IPA + logs)
        uses: actions/upload-artifact@v4
        with:
          name: nutricoach-ipa-${{ inputs.configuration || 'Debug' }}
          path: |
            build/NutriCoach-*.ipa
            build/xcodebuild.log
            build/xcodebuild-signed.log
          retention-days: 30
          if-no-files-found: warn

      - name: Cleanup keychain
        if: always()
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
