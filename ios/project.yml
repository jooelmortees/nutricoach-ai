# ============================================================
# project.yml - XcodeGen
# Define el proyecto Xcode que se generará en GitHub Actions
# ============================================================

name: NutriCoach
options:
  bundleIdPrefix: com.nutricoach
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: es
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  defaultConfig: Debug
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    exactVersion: 2.52.0
  KeychainAccess:
    url: https://github.com/kishikawakatsumi/KeychainAccess
    from: 4.2.2
  SwiftStreamingMarkdown:
    url: https://github.com/microsoft/SwiftStreamingMarkdown
    revision: 21893c1c1de34676df96adf68b82bf675445afbe

targets:
  NutriCoach:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    resources:
      - path: Sources/Resources/Assets.xcassets
        optional: true
    info:
      path: Sources/Resources/Info.plist
      properties:
        CFBundleDisplayName: NutriCoach
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        SUPABASE_URL: "$(SUPABASE_URL)"
        SUPABASE_ANON_KEY: "$(SUPABASE_ANON_KEY)"
        NutriCoachKeychainAccessGroup: "$(AppIdentifierPrefix)com.joelmortees.nutricoach.shared"
        CFBundleURLTypes:
          - CFBundleURLName: com.joelmortees.nutricoach
            CFBundleURLSchemes:
              - nutricoach
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
        UIBackgroundModes:
          - fetch
          - processing
        NSHealthShareUsageDescription: "NutriCoach necesita acceso a tu salud (pasos, frecuencia cardíaca, sueño, entrenamientos) para personalizar tu dieta."
        NSHealthUpdateUsageDescription: "NutriCoach registra en Apple Health las comidas y métricas que llevas un seguimiento."
        NSCameraUsageDescription: "Necesitamos la cámara para fotografiar tus comidas y que el agente las analice."
        NSPhotoLibraryUsageDescription: "Para que puedas elegir fotos de tus comidas desde la galería."
        NSPhotoLibraryAddUsageDescription: "Para guardar en tu galería las recetas e informes que generes."
        NSMicrophoneUsageDescription: "NutriCoach necesita el micrófono para grabar notas de voz que puedes adjuntar al chat."
        NSLocationWhenInUseUsageDescription: "Opcional: para registrar dónde comes y detectar restaurantes frecuentes."
        NSUserNotificationUsageDescription: "Para enviarte recordatorios de comidas, hidratación y entrenamiento."
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joelmortees.nutricoach
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: NO
        ENABLE_DEBUG_DYLIB: NO
        SWIFT_ENABLE_PREVIEWS: NO
        DEVELOPMENT_ASSET_PATHS: ""
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    entitlements:
      path: Sources/Resources/NutriCoach.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.applesignin:
          - Default
        aps-environment: development
        com.apple.security.application-groups:
          - group.com.joelmortees.nutricoach
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.joelmortees.nutricoach
          - $(AppIdentifierPrefix)com.joelmortees.nutricoach.shared
    dependencies:
      - package: Supabase
        product: Supabase
      - package: KeychainAccess
      - package: SwiftStreamingMarkdown
        product: SwiftStreamingMarkdown
      - target: NutriCoachWidgets
        embed: true
      - sdk: HealthKit.framework
      - sdk: AVFoundation.framework
      - sdk: Photos.framework
      - sdk: UserNotifications.framework
      - sdk: AuthenticationServices.framework

  NutriCoachWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WidgetExtension
      - path: Sources/Shared
      - path: Sources/Models/Models.swift
      - path: Sources/Services/Config.swift
      - path: Sources/Services/DateParsing.swift
      - path: Sources/Services/SupabaseClient.swift
      - path: Sources/Services/DailyTrackingService.swift
    info:
      path: WidgetExtension/Info.plist
      properties:
        CFBundleDisplayName: NutriCoach
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        SUPABASE_URL: "$(SUPABASE_URL)"
        SUPABASE_ANON_KEY: "$(SUPABASE_ANON_KEY)"
        NutriCoachKeychainAccessGroup: "$(AppIdentifierPrefix)com.joelmortees.nutricoach.shared"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joelmortees.nutricoach.widgets
        PRODUCT_NAME: NutriCoachWidgets
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: NO
        ENABLE_DEBUG_DYLIB: NO
        SWIFT_ENABLE_PREVIEWS: NO
    entitlements:
      path: WidgetExtension/NutriCoachWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.joelmortees.nutricoach
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.joelmortees.nutricoach.shared
    dependencies:
      - package: Supabase
        product: Supabase
      - package: KeychainAccess
      - sdk: WidgetKit.framework
      - sdk: AppIntents.framework

  NutriCoachTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    dependencies:
      - target: NutriCoach
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joelmortees.nutricoach.tests
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/NutriCoach.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/NutriCoach"
