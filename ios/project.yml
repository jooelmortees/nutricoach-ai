name: NutriCoach
options:
  bundleIdPrefix: com.nutricoach
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: es
  createIntermediateGroups: true
  defaultConfig: Debug
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"

targets:
  NutriCoach:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    resources:
      - path: Sources/Resources/Assets.xcassets
        optional: true
    info:
      path: Sources/Resources/Info.plist
      properties:
        CFBundleDisplayName: NutriCoach
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joelmortees.nutricoach
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO

  NutriCoachTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    dependencies:
      - target: NutriCoach
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joelmortees.nutricoach.tests
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/NutriCoach.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/NutriCoach"
